name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUFF_VERSION: '0.17.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # astral-sh/ruff-action@v4.1.0
      - name: ruff check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          version: ${{ env.RUFF_VERSION }}
          args: check

      # astral-sh/ruff-action@v4.1.0
      - name: ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          version: ${{ env.RUFF_VERSION }}
          args: format --check

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # 3.11 is the Python that Raspberry Pi OS Bookworm ships.
      # actions/setup-python@v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pytest-timeout

      # Catches syntax errors in files no test imports, such as the entrypoint.
      - name: Compile
        run: python -m compileall -q src tests

      # An explicit timeout so a hung test fails fast instead of holding the
      # runner until the job timeout.
      - name: Test
        run: python -m pytest -q --timeout 300

  webapp-lint:
    name: Webapp lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-node@v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      # Run `make lint` to fix formatting locally.
      - name: Prettier
        run: npx --yes prettier@3.9.10 --check webapp/src

  # The webapp has no tests. Its build runs tsc before vite, so it type-checks
  # and confirms what ships in the module tarball.
  webapp-build:
    name: Webapp build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webapp
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-node@v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # The committed lockfile lacks esbuild's and rollup's platform packages,
      # so npm ci rejects it. npm install matches what `make webapp` runs.
      - run: npm install

      - name: Build
        run: npm run build
